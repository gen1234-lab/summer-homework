<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌻夏休みの宿題🌻</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- 宿題イラスト -->
    <img src="images/homework.png"
         id="board"
         alt="夏休みの宿題">

    <!-- 進捗表示 -->
    <div id="progress">
        のこり <span id="remain">7</span>こ
    </div>

    <!-- ========= チェックボックス ========= -->

    <input type="checkbox" id="diary" class="check">

    <input type="checkbox" id="green" class="check">

    <input type="checkbox" id="brown" class="check">

    <input type="checkbox" id="seed" class="check">

    <input type="checkbox" id="drawing" class="check">

    <input type="checkbox" id="drill" class="check">

    <input type="checkbox" id="movie" class="check">

    <!-- ================================ -->

    <div id="complete">

        🎉<br>
        おめでとう！<br>
        ぜんぶ おわったよ！

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
