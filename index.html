<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌻 夏休みの宿題 🌻</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4FC3F7">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🌻 夏休みの宿題 🌻</h1>

<p class="message">
毎日コツコツがんばろう😊
</p>

</header>

<main>

<section class="progress-area">

<h2>しんちょく</h2>

<div class="progress">

<div id="progressBar" class="progress-bar"></div>

</div>

<p id="progressText">
0 / 7 完了
</p>

</section>

<section class="homework">

<div class="card">

<label>

<input type="checkbox" id="diary">

📖 絵日記

</label>

</div>

<div class="card">

<h3>🌱 朝顔観察</h3>

<label>

<input type="checkbox" id="green">

みどりのみ

</label>

<label>

<input type="checkbox" id="brown">

ちゃいろのかひ

</label>

</div>

<div class="card">

<label>

<input type="checkbox" id="seed">

🌸 タネ回収

</label>

</div>

<div class="card">

<label>

<input type="checkbox" id="drawing">

🎨 全国児童絵画コンクール

</label>

</div>

<div class="card">

<label>

<input type="checkbox" id="drill">

💻 ネットドリル（8/1）

</label>

</div>

<div class="card">

<label>

<input type="checkbox" id="movie">

🎥 ネットモラル動画

</label>

</div>

</section>

<section class="reward">

<h2>⭐ ごほうび ⭐</h2>

<div id="stars">

☆☆☆☆☆☆☆

</div>

</section>

<section class="today">

<h2>📅 今日やること</h2>

<p id="todayTask">

宿題をえらぼう！

</p>

</section>

<section class="finish" id="finishArea" style="display:none;">

<h2>

🎉 おめでとう！！

</h2>

<p>

しゅくだい<br>

ぜんぶできた！！

</p>

</section>

</main>

<footer>

<p>

Made with ❤️ by パパ

</p>

</footer>

<script src="app.js"></script>

</body>

</html>
